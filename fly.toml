# Fly.io configuration for Ringback.
# One always-on machine: Vonage webhooks and the board's SSE stream need a persistent process,
# and the SQLite file lives on a mounted volume so a restart mid-demo loses nothing.

app = "ringback"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/ringback.db"
  VONAGE_PRIVATE_KEY_PATH = "/app/private.key"
  ALL_PARTY_CONSENT_STATE = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
